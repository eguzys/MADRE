[project]
name = "manetnodesrelocation"
version = "0.1.0"
description = "Flexible state representation in jammed MANETs: comparing FFN, Set Transformer, and GNN architectures for variable-size multi-agent anti-jamming relocation (PADRE / BenchMARL)."
authors = [
    {name = "silaas",email = "silas.j.leuenberger@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11.0,<3.12.0"
dependencies = [
    "torch (>=2.11.0,<2.12.0)",
    "torchrl (>=0.11.1,<0.12.0)",
    "tensordict (>=0.11.0,<0.12.0)",
    "benchmarl (>=1.5.2,<2.0.0)",
    "pettingzoo (>=1.24.0,<2.0.0)",
    "gymnasium (>=1.0.0,<2.0.0)",
    "hydra-core (>=1.3.0,<2.0.0)",
    "wandb (>=0.18.0,<1.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pulp (>=2.9.0,<3.0.0)",
    "networkx (>=3.4.2,<4.0.0)",
    "ipywidgets (>=8.1.5,<9.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.15.1,<2.0.0)",
    "shapely (>=2.0.6,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "jinja2 (>=3.1.5,<4.0.0)",
    "mkdocstrings-python (>=1.16.5,<2.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocstrings (>=0.29.0,<0.30.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "MANET", from = "src" },
    { include = "Utils", from = "src" },
    { include = "benchmarl_padre", from = "src" },
    { include = "architectures", from = "src" },
    { include = "evaluation", from = "src" },
    { include = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
mkdocs = "^1.6.1"
mkdocstrings-python = "^1.13.0"
mkdocs-material = "^9.5.49"
memory-profiler = "^0.61.0"
pybind11 = "^2.13.6"
