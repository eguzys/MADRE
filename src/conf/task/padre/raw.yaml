defaults:
  - _self_

# Env params for PADRE anti-jamming task.
# Must match PADRE's SB3 YAML for fair FFN baseline comparison.
# Source of truth: src/examples/[wherever PADRE's training yaml lives]

numbOfNodes: 4
numbOfJammers: 1
numbOfUsers: [5, 20]
ep_length: 1000
state_loss_rate: 0.3
self_flag: true
aoi: true
history_K: 1
mask: true
obs_wrapper: raw
# encoder_mode: "frozen" (default) pools each drone's user set here in the
# env with the frozen DeepSets encoder; "learned" (see raw_learnenc.yaml)
# emits padded raw user tokens instead and lets each model pool them with
# its own trainable encoder. Must match the model config's encoder_mode.
encoder_mode: frozen
