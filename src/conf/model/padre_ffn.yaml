# Raw-obs-track FFN, built on architectures/ffn_model.py (NOT stock
# BenchMARL Mlp/padre_mlp.yaml) so it can own a learnable user-set encoder
# submodule. encoder_mode: "frozen" (default, functionally equivalent to
# padre_mlp.yaml: flattens (n_peers, features) incl. the drone axis, feeds
# a MultiAgentMLP) | "learned" (own from-scratch trainable user-set
# encoder, max_users must match the task's numbOfUsers upper bound). The
# drone/peer axis is always flattened, in both modes -- FFN structurally
# cannot pool a variable-size set, which is the point of the comparison.
# obs_layout: "padre" (default) | "omnet" -- selects the own_state/user-token
# column geometry the learned-mode reassembly uses (architectures/
# user_encoder.py's OBS_LAYOUTS). Only consulted when encoder_mode=="learned".
# The OMNeT track needs max_users=25 (MAX_USERS_CAP), NOT this file's 20 --
# override both on the CLI for an omnet/*_learnedenc run.
name: padre_ffn

num_cells: [256, 256]
activation_class: torch.nn.Tanh
encoder_mode: frozen
max_users: 20
obs_layout: padre
