# ═══════════════════════════════════════════════════════════════════════════
#  om2g.ini — the OM2G track: IEEE 802.15.4 narrowband message compression
# ═══════════════════════════════════════════════════════════════════════════
#
#  ⚠️  THIS IS NOT omnetpp.ini.  ⚠️
#
#  omnetpp.ini  →  track OMNET.  network SmokeNet.  802.11g, 20 MHz, ~50 Mbps.
#                  Thesis question: perm-invariant aggregator vs FFN.
#  om2g.ini     →  track OM2G.    network OM2GNet.  802.15.4, 2.8 MHz, 250 kbps.
#                  Thesis question: is the encoder a good learned MESSAGE
#                  COMPRESSOR for inter-agent state?
#
#  Results from the two files are NEVER comparable: different channel
#  capacity, different reward scale, different observation semantics.
#  See code/om2g/OM2G_README.md.
#
#  Every number here that has a Python twin is derived in code/om2g/
#  om2g_track.py and injected via $OMNET_EXTRA_ARGS by om2g_config.py.  The
#  literals below are the DEFAULTS, kept in sync by om2g_config.selftest();
#  they are not a second source of truth.
# ═══════════════════════════════════════════════════════════════════════════

[General]
network = rlsmoke.OM2GNet

record-scalar-results = false
record-vector-results = false
record-eventlog = false
sim-time-limit = 260s

# ─── Node counts (identical to the OMNET v2 trainable config) ────────────────
*.numDrones = 5
*.numUsers  = 40   # raised from 17 with the control-plane charge; see om2g_track.OM2G_NUM_USERS

# ─── Arena: the v2 trainable geometry, L = 2000 m ────────────────────────────
# NOT omnetpp.ini's L=1700 (the task_validation choice for the OMNET track's
# reward).
#
# The ini default matches om2g_track.py's 1200 m default, which
# om2g_selftest's arena check compares against.  At runtime om2g_config always
# emits an explicit --*.rlBridge.arenaWidth override in $OMNET_EXTRA_ARGS, so
# the deployed arena comes from the cell's exports, not from this line.
*.rlBridge.arenaWidth  = 1200.0
*.rlBridge.arenaHeight = 1200.0
*.rlBridge.maxClusters = 2
*.rlBridge.droneSpawnMode = "staging"
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMaxX = 1200m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxY = 1200m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m

*.rlBridge.placementMode = "padre"
*.rlBridge.userSpread    = 916.6666666666666  # BASE; effective = base * L/2000
                                              # = 916.667 * 1200/2000 = 550 m, the canonical spread
*.rlBridge.trafficMode   = "padre"
*.rlBridge.pCross        = 0.5

*.rlBridge.syncInterval  = 1s
*.rlBridge.maxSteps      = 250
*.rlBridge.episodeSeed   = ${episodeSeed = 0}

# ═══ THE ONE THING THAT CHANGED: the radio ══════════════════════════════════
#
# IEEE 802.15.4-2006 narrowband, 2450 MHz, DSSS-OQPSK-16, 250 kbps over a
# 2.8 MHz channel.  INET 4.6 ships this as a first-class model, so this is a
# standard swap, not a hand-narrowed 802.11.
#
# Capacity is set by bandwidth/bitrate, NOT by carrier frequency: 802.11g and
# 802.15.4 sit in the same 2.4 GHz band and differ by 200x in rate.  The
# carrier is unchanged precisely so that nobody can attribute the result to a
# frequency change.
**.wlan[*].typename = "Ieee802154NarrowbandInterface"

# ⚠️ The radio INSIDE the interface must be overridden too.  rlsmoke/UserHost.ned
# carries `wlan[*].radio.typename = default("Ieee80211ScalarRadio")` as a NED
# pattern assignment, which is MORE SPECIFIC than the interface typename above
# and therefore survives it: without these two lines every user ends up with an
# 802.11 transmitter bolted inside an 802.15.4 interface, and the run dies at
# init with "Unknown bitrate ... in operation mode 'g(mixed)'".  Set for drones
# as well, explicitly, so both node classes use the same radio.
*.user[*].wlan[*].radio.typename = "Ieee802154NarrowbandRadio"
*.host[*].wlan[*].radio.typename = "Ieee802154NarrowbandRadio"

# Propagation: IDENTICAL to the OMNET track.  Overrides the medium's own
# BreakpointPathLoss default so "only the channel capacity moved" is literally
# true.  INET's LogNormalShadowing computes
#     PL(d) = 20*log10(4*pi/lambda) + 10*alpha*log10(d) + N(0, sigma)
# which is exactly max_flow_reward's own model (verified against
# inet4.6/.../pathloss/LogNormalShadowing.cc).
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.pathLoss.alpha    = 2.5
*.radioMedium.pathLoss.sigma    = 4

# ─── TX power: chosen to REPRODUCE the OMNET track's radio ranges ────────────
#
# The experiment is defined by dimensionless ratios (om2g_track.py).  On the
# 802.15.4 link budget (sensitivity -100 dBm, FSPL(1 m) @2.45 GHz = 40.225 dB,
# alpha = 2.5) the powers that land on the OMNET track's own median ranges are:
#
#   drone  r_d = 523.06 m  ->  +8.189 dBm  =  6.5900 mW
#   user   r_u = 157.82 m  ->  -4.821 dBm  =  0.3295 mW
#
# Both are ordinary settable 802.15.4 levels.  The 13 dB drone/user asymmetry
# is carried over UNCHANGED from the OMNET track: it is what creates the
# coverage problem (users must be reached; drones must relay), and equalising
# it destroys the task rather than simplifying it.  See omnet2G.md section 4.
*.host[*].wlan[*].radio.transmitter.power = 6.5900mW
*.user[*].wlan[*].radio.transmitter.power = 0.3295mW

# The remaining PHY parameters are INET's own 802.15.4 defaults, restated so a
# reader does not have to open the NED to know what channel this is:
#   receiver.sensitivity   -100 dBm   receiver.snirThreshold  -8 dB
#   bandwidth              2.8 MHz    bitrate                 250 kbps
#   backgroundNoise.power  -96.616 dBm
# Which gate binds: max(-100, -96.616 - 8) = -100 -> SENSITIVITY.  Same
# structure as the OMNET track, so the reward's decode-gate geometry carries
# over unchanged.

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
*.radioMedium.analogModel.ignorePartialInterference = true

**.hasStatus = true

# ─── Drone mobility ──────────────────────────────────────────────────────────
**.host[*].mobility.typename      = "RLControlledMobility"
**.host[*].mobility.bridgeModule  = "^.^.rlBridge"
# maxSpeed is a CEILING, not a scale.
# It must be >= step_m or the drone moves less than the commanded step.
**.host[*].mobility.maxSpeed      = 60mps

# ═══ THE STATE MESSAGE ══════════════════════════════════════════════════════
#
# DroneBeaconApp broadcasts each drone's own state to the drone-only multicast
# group once per RL step, over the SAME medium the user voice traffic uses.
# beaconBytes IS the arm: it is the real size of the inter-agent message.
#
#   OM2G_COMPRESSED    88 B  -> 1 frame   (fits the 90 B one-frame UDP budget)
#   OM2G_UNCOMPRESSED 1356 B -> 15 frames (IPv4-fragmented over a 118 B MTU)
#
# Overridden per arm by om2g_config.py; the default is the compressed arm.
*.host[*].app[0].beaconBytes     = 88
*.host[*].app[0].beaconInterval  = 1s

# ─── User apps: Bonn talk-group traffic, UNCHANGED from the OMNET track ──────
*.user[*].numApps = 2
*.user[*].app[0].typename = "UserAssociationModule"
*.user[*].app[0].userId   = parent.userId
*.user[*].app[1].typename = "UserBonnTrafficApp"
*.user[*].app[1].userId   = parent.userId

*.user[*].app[1].headInitiatorProb    = 0.46
*.user[*].app[1].meshProb             = 0.136
*.user[*].app[1].transHeadToHead      = 0.142
*.user[*].app[1].transMemberToMember  = 0.190
*.user[*].app[1].callContinuationProb = 0.7
*.user[*].app[1].callCHT_meanlog      = 0.4438584
*.user[*].app[1].callCHT_sdlog        = 0.7766512
*.user[*].app[1].callIdle_shape       = 1.530391
*.user[*].app[1].callIdle_rate        = 1.606532
*.user[*].app[1].convIdle_meanlog     = 1.390844
*.user[*].app[1].convIdle_sdlog       = 1.628825
*.user[*].app[1].convIdle_shift       = 3.0
# MELPE 2.4 kbps voice: 21 B every 67.5 ms.  49 B as a UDP/IPv4 datagram,
# comfortably inside the 118 B 802.15.4 MTU -- the DATA plane never fragments.
# Only the uncompressed CONTROL plane does.
*.user[*].app[1].melpePayloadBytes    = 21
*.user[*].app[1].melpeInterval_ms     = 67.5
*.user[*].app[1].packetSizeMultiplier = 1

# ─── Drone apps ──────────────────────────────────────────────────────────────
*.host[*].numApps = 2
*.host[*].app[0].typename = "DroneBeaconApp"
*.host[*].app[0].droneId  = parent.droneId
*.host[*].app[1].typename = "UdpSink"
*.host[*].app[1].localPort = 5001

# ─── Routing: oracle, exactly as on the OMNET track ──────────────────────────
*.configurator.addStaticRoutes  = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes  = false
*.user[*].ipv4.configurator.configureRoutingTable = false
*.user[*].ipv4.routingTable.netmaskRoutes = "lo*"
**.arp.typename = "GlobalArp"

# ─── RNG separation ──────────────────────────────────────────────────────────
num-rngs = 3
**.mobility.rng-0    = 1
**.wlan[*].mac.rng-0 = 2

# ─── Jammer: OFF ─────────────────────────────────────────────────────────────
# JammerNoiseSource emits only at step >= activate (JammerGradientMobility.cc),
# so activate > maxSteps means it never transmits at all.  Its transmitter is
# still narrowed to this band so nothing in the medium's frequency bookkeeping
# trips at init.
*.jammer.transmitter.power           = 1mW
*.jammer.transmitter.centerFrequency = 2450MHz
*.jammer.transmitter.bandwidth       = 2.8MHz
*.jammer.transmitter.duration        = 5ms
*.jammer.sleepInterval               = 1ms
*.jammer.mobility.startMoving  = 999999
*.jammer.mobility.activate     = 999999
*.jammer.mobility.numSamples   = 8
*.jammer.mobility.stepSize     = 60m
*.jammer.mobility.syncInterval = 1s

abstract = false

# ═══════════════════════════════════════════════════════════════════════════
#  The two arms.  Everything except beaconBytes is identical.
# ═══════════════════════════════════════════════════════════════════════════

# The encoder latent IS the message: 14 fixed floats + 8 latent floats = 22
# float32 = 88 B.  The one-frame UDP payload budget on 802.15.4 is
# 118 - 20 - 8 = 90 B, so this is exactly ONE frame with 2 bytes to spare.
[Config OM2G_COMPRESSED]
extends = General
*.host[*].app[0].beaconBytes = 88

# No compression: the raw per-user token block padded to MAX_USERS_CAP=40
# users x 13 features = 520 floats, plus the same 14 fixed floats = 534
# float32 = 2136 B.  Over a 118 B MTU that is a 23-fragment IPv4 datagram,
# and every fragment must survive for the message to be usable.
# (See om2g_track.OM2G_MAX_USERS_CAP for the user cap.)
[Config OM2G_UNCOMPRESSED]
extends = General
*.host[*].app[0].beaconBytes = 2136

# Regime probe (om2g_regime_probe.py): no learned model, scripted actions,
# used to measure mean neighbour count and control-plane share before any
# training is launched.
[Config OM2G_PROBE]
extends = General
cmdenv-express-mode = true

# Silent control plane -- the reference point that isolates how much of the
# channel the state exchange itself costs.
[Config OM2G_NOCONTROL]
extends = General
*.host[*].app[0].beaconBytes    = 4
*.host[*].app[0].beaconInterval = 3600s
