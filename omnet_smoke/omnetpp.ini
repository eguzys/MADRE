[General]
network = rlsmoke.SmokeNet

# ─── Result recording: OFF ───────────────────────────────────────────────────
# Nothing reads .vec/.sca files (reward/obs/baselines all flow over ZMQ live).
# Recording generated multi-hundred-MB .vec files that bloated git and would
# threaten the cluster inode quota. Disabled at the source on every platform.
# Record no results (.vec/.vci/.sca). Nothing reads them — reward/obs flow over
# ZMQ live; validate_traffic.py parses stdout, not result files. Empty
# recording-modes is OMNeT++'s idiomatic "record nothing" switch.
# Prevent result-file creation entirely. The per-object *-recording toggles
# only suppress item recording but still write a header-only file (OMNeT++ 6.2+
# release notes); record-{scalar,vector}-results = false stops file creation.
# Nothing reads these — reward/obs flow over ZMQ; validate_traffic parses stdout.
record-scalar-results = false
record-vector-results = false
record-eventlog = false
sim-time-limit = 60s

# ─── Node counts ─────────────────────────────────────────────────────────────
*.numDrones = 5
*.numUsers  = 17

# ─── Arena: 100 m × 100 m (PADRE parity) ─────────────────────────────────────
# ─── FROZEN SCENARIO (task_validation.py, 2026-07-14) ────────────────────────
# Selected by the phase-1 protocol: three scripted probes (P0 random / P1 greedy /
# P2 scripted relay), six fixed criteria, NO learned model loaded anywhere.
# This config was set before any RL training.
#
# Sweep: L in {1000,1100,1200,1300,1400,1700} x max_clusters in {2,3}, n=100/cell.
#
#   max_clusters=3: NOTHING passed. Small L -> solvable but P2/P1 < 2.0 (greedy does
#   too well). Large L -> good headroom but 20-24% of episodes need MORE THAN 5
#   drones (3 access + 3 relays = 6). The two criteria cross around L=1350 with no
#   overlap.
#
#   max_clusters=2: frees a third drone for relaying. Infeasibility 20% -> 2%.
#
# WINNER: L=1700, max_clusters=2 (n=100)
#   P0   0.0   P1 143.0   P2 303.7   (P2/P1 = 2.12x)
#   infeasible 2%   median relays 2   coverage 0.98
#   ALL SIX CRITERIA PASS. Largest passing arena, per the protocol.
#
# Notes:
#   - Only ONE cell passes. A narrow window, not a plateau.
#   - 2.12x is close to the 2.0x threshold.
#
# Kept fixed once training begins.
*.rlBridge.arenaWidth  = 1700.0
*.rlBridge.arenaHeight = 1700.0
*.rlBridge.maxClusters = 2
*.rlBridge.droneSpawnMode = "cluster"
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMaxX = 1700m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxY = 1700m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m

# --- PADRE mode (THE THESIS CONFIG - active by default) ---------------------
# Set in [General] (not only in [Config padre_spawn]/[Config padre_traffic]) so
# that every run uses PADRE spawn and traffic by default.
*.rlBridge.placementMode = "padre"
*.rlBridge.userSpread    = 30.0   # BASE spread; scaled by arena/2000 in samplePadreClusters (matches task_validation.py)
*.rlBridge.trafficMode   = "padre"
*.rlBridge.pCross        = 0.5

# ─── RLBridge ────────────────────────────────────────────────────────────────
*.rlBridge.syncInterval  = 1s
*.rlBridge.maxSteps      = 5    # short for smoke; bump to 1000 for real
*.rlBridge.episodeSeed   = ${episodeSeed = 0}

# ─── Radio: IEEE 802.11g, scalar analog model ─────────────────────────────────
**.wlan[*].typename   = "Ieee80211Interface"
**.wlan[*].opMode     = "g(erp)"
**.wlan[*].radio.typename  = "Ieee80211ScalarRadio"
**.wlan[*].radio.bandName  = "2.4 GHz"

# Drone TX: 200 mW (spec Section 2.1).  User TX: 10 mW.
*.host[*].wlan[*].radio.transmitter.power = 200mW
*.user[*].wlan[*].radio.transmitter.power = 10mW

# Multicast IGMP join reports all fire at t=0 during init; suppress the collision check.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

# ─── Pathloss: log-distance + log-normal shadowing ────────────────────────────
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.pathLoss.alpha    = 2.5
*.radioMedium.pathLoss.sigma    = 4

# ─── Lifecycle ────────────────────────────────────────────────────────────────
**.hasStatus = true

# ─── Drone mobility: Python-driven ───────────────────────────────────────────
**.host[*].mobility.typename      = "RLControlledMobility"
**.host[*].mobility.bridgeModule  = "^.^.rlBridge"
**.host[*].mobility.maxSpeed      = 20mps

# Drone initial positions.
# ⚠️ Inactive under the frozen config. droneSpawnMode="cluster" OVERRIDES these at
# runtime (RLBridge::sampleDroneSpawns, after the user clusters are sampled), so
# drones spawn on the actual clusters, not on this hardcoded cross. These lines
# survive only as the droneSpawnMode="ini" fallback. EDITING THEM HAS NO EFFECT.
*.host[0].mobility.initialX = 25m
*.host[0].mobility.initialY = 25m
*.host[0].mobility.initialZ = 0m
*.host[1].mobility.initialX = 75m
*.host[1].mobility.initialY = 25m
*.host[1].mobility.initialZ = 0m
*.host[2].mobility.initialX = 50m
*.host[2].mobility.initialY = 50m
*.host[2].mobility.initialZ = 0m
*.host[3].mobility.initialX = 25m
*.host[3].mobility.initialY = 75m
*.host[3].mobility.initialZ = 0m
*.host[4].mobility.initialX = 75m
*.host[4].mobility.initialY = 75m
*.host[4].mobility.initialZ = 0m

# ─── User app configuration ───────────────────────────────────────────────────
*.user[*].numApps = 2
*.user[*].app[0].typename = "UserAssociationModule"
*.user[*].app[0].userId   = parent.userId
*.user[*].app[1].typename = "UserBonnTrafficApp"
*.user[*].app[1].userId   = parent.userId

# ── Bonn talk-group traffic model (Aschenbruck IPCCC 2007 + LCN 2006) ─────────
# Conversation-process probabilities (IPCCC 2007 Table 2):
*.user[*].app[1].headInitiatorProb    = 0.46
*.user[*].app[1].meshProb             = 0.136
*.user[*].app[1].transHeadToHead      = 0.142
*.user[*].app[1].transMemberToMember  = 0.190
*.user[*].app[1].callContinuationProb = 0.7
# Holding-time distributions (LCN 2006):
*.user[*].app[1].callCHT_meanlog      = 0.4438584
*.user[*].app[1].callCHT_sdlog        = 0.7766512
*.user[*].app[1].callIdle_shape       = 1.530391
*.user[*].app[1].callIdle_rate        = 1.606532
*.user[*].app[1].convIdle_meanlog     = 1.390844
*.user[*].app[1].convIdle_sdlog       = 1.628825
*.user[*].app[1].convIdle_shift       = 3.0
# MELPE codec (2.4 kbps voice):
*.user[*].app[1].melpePayloadBytes    = 21
*.user[*].app[1].melpeInterval_ms     = 67.5
*.user[*].app[1].packetSizeMultiplier = 1

# ─── Drone app configuration ─────────────────────────────────────────────────
*.host[*].numApps = 2
*.host[*].app[0].typename = "DroneBeaconApp"
*.host[*].app[0].droneId  = parent.droneId
*.host[*].app[1].typename = "UdpSink"
*.host[*].app[1].localPort = 5001

# ─── AODV routing setup (INET-standard) ──────────────────────────────────────
*.configurator.addStaticRoutes  = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes  = false
# AODV is not used on this track. Its netfilter hook (datagramLocalOutHook ->
# ensureRouteForDatagram, Aodv.cc:193) requires a route carrying AodvRouteData, while
# RLBridge installs MANUAL / IFACENETMASK oracle routes, which carry none, so AODV
# would queue every voice packet pending an RREQ to a user node that does not run AODV.
# Routing is fully oracle (rebuildOracleRoutes, RLBridge.cc), consistent with the
# position-oracle reward.
#**.aodv.activeRouteTimeout = 1s
*.user[*].ipv4.configurator.configureRoutingTable = false  # users: empty table, default route installed by UserAssociationModule

# Ipv4RoutingTable installs its OWN on-link netmask routes, independently of the
# configurator (netmaskRoutes is a glob matched against interface names; default
# "*" = all). configureRoutingTable=false only silences the CONFIGURATOR.
# With it, every user gets an on-link 10.0.0.0/24 route, which beats the MANUAL
# default route to its drone on longest-prefix-match, so users would address each
# other directly instead of through the drone gateway.
# "NONE" matches no real interface name, so no netmask route is installed and the
# default route (to the associated drone) becomes the only path off-node.
*.user[*].ipv4.routingTable.netmaskRoutes = "lo*"

# DIAGNOSTIC: GlobalArp resolves L2 addresses from a global table — instant,
# never fails, no pending queue. If delivery works with this and not with real
# Arp, the loss is ARP resolution (packets stuck in ARP's pending queue, which
# emits no packetDropped signal).
**.arp.typename = "GlobalArp"

# ─── RNG separation ──────────────────────────────────────────────────────────
num-rngs = 3
**.mobility.rng-0      = 1
**.wlan[*].mac.rng-0   = 2

# ─── Jammer configuration ────────────────────────────────────────────────────
# Jammer noise bursts overlap in frequency with the 802.11 signals; ScalarMediumAnalogModel
# throws on partial-frequency overlap by default. Ignore it — the jammer intentionally
# covers the whole 2.4 GHz band, so the partial overlap IS the desired interference.
*.radioMedium.analogModel.ignorePartialInterference = true

# Radio: NoiseSource — continuous on-channel noise, no CSMA deferral.
*.jammer.transmitter.power          = 300mW
*.jammer.transmitter.centerFrequency = 2.4GHz
*.jammer.transmitter.bandwidth      = 20MHz
# Short bursts under INET's 10ms maxTransmissionDuration cap; sleep→transmit cycle
# restarts automatically via scheduleSleepTimer(), giving continuous interference.
*.jammer.transmitter.duration       = 5ms
*.jammer.sleepInterval              = 1ms

# Mobility params — match drone per-step displacement (20 m/s × 1 s = 20 m).
*.jammer.mobility.startMoving  = 100
*.jammer.mobility.activate     = 500
*.jammer.mobility.numSamples   = 8
*.jammer.mobility.stepSize     = 20m
*.jammer.mobility.syncInterval = 1s

abstract = false

# ─── numUsers=10 test config ──────────────────────────────────────────────────
[Config numUsers10]
extends = General
*.numUsers = 10

# ─── numUsers=25 test config ──────────────────────────────────────────────────
[Config numUsers25]
extends = General
*.numUsers = 25

# ─── Seed sweep configs for verification ──────────────────────────────────────
[Config seed42]
extends = General
*.rlBridge.episodeSeed = 42

[Config seed99]
extends = General
*.rlBridge.episodeSeed = 99

# ─── Validation config (used by omnet_module/validate_traffic.py) ─────────────
[Config validate]
extends = General
sim-time-limit = 300s
*.rlBridge.maxSteps = 300
cmdenv-express-mode = true

# ─── Jammer verification (Task 6) ─────────────────────────────────────────────
# Full 1000-step episode with N=5 drones and the gradient-seeking jammer.
# Expected observable events:
#   step   0..99  — jammer holds spawn position, noise_floor ~ -100 dBm everywhere
#   step 100..499 — jammer moves toward drone cluster (position converges/stabilises)
#   step 500..999 — jammer frozen, noise_floor spikes for nearby drones,
#                   throughput at jammed drones drops
#
# Requires a ZMQ stub on tcp://localhost:5555 that returns zero-velocity actions.
# Quick stub: python3 omnet_module/smoke_test.py --num-drones 5 --max-steps 1000
[Config jammer_verify]
extends = General
sim-time-limit   = 1010s
*.rlBridge.maxSteps = 1000
cmdenv-express-mode = true

# ─── PADRE-style user spawn (Gaussian clusters) ──────────────────────────────
# Additive: leaves Bonn placement byte-identical. Users spawn in PADRE clusters;
# area label = cluster id. arena 2000 m in this legacy config.
# LEGACY. Bonn talk-group multicast traffic + Bonn user placement.
# NOT the thesis config. PADRE spawn+traffic are the defaults in [General].
[Config bonn_legacy]
extends = General
*.rlBridge.placementMode = "bonn"
*.rlBridge.trafficMode   = "bonn"

# ─── PADRE-style point-to-point traffic ──────────────────────────────────────
# Additive: leaves Bonn traffic (talk-group + multicast) byte-identical.
# Senders unicast to one partner per talk group, drawn cross-cluster with
# probability pCross (fallback to same-cluster if none available).

# ─── Small-arena DIAGNOSTIC (not the thesis config) ──────────────────────────
# Forces a densely-connected mesh by geometry so drop behaviour can be measured
# in a network that actually carries relayed traffic. Range ~525m @12Mbps vs
# 600m diagonal 848m -> range/diagonal ~0.62 (real config: 0.19).
[Config small_arena]
extends = General
*.rlBridge.arenaWidth  = 600.0
*.rlBridge.arenaHeight = 600.0
**.mobility.constraintAreaMaxX = 600m
**.mobility.constraintAreaMaxY = 600m
*.host[0].mobility.initialX = 150m
*.host[0].mobility.initialY = 150m
*.host[1].mobility.initialX = 450m
*.host[1].mobility.initialY = 150m
*.host[2].mobility.initialX = 300m
*.host[2].mobility.initialY = 300m
*.host[3].mobility.initialX = 150m
*.host[3].mobility.initialY = 450m
*.host[4].mobility.initialX = 450m
*.host[4].mobility.initialY = 450m

# ─── PADRE-parity arena: 100 m × 100 m ───────────────────────────────────────
# PADRE's SIZE = 100 m. At 2000 m the user
# uplink (10 mW, ~115 m) cannot reach an associated drone (200 mW beacon, ~525 m
# downlink) -- so with netmaskRoutes="lo*" forcing all traffic via the drone,
# ARP fails, nothing is sent, FES starves, sim dies at t=1s.
# At 100 m every user is inside uplink range of every drone.
[Config padre_arena]
extends = General
*.rlBridge.arenaWidth  = 100.0
*.rlBridge.arenaHeight = 100.0
**.mobility.constraintAreaMaxX = 100m
**.mobility.constraintAreaMaxY = 100m
*.host[0].mobility.initialX = 25m
*.host[0].mobility.initialY = 25m
*.host[1].mobility.initialX = 75m
*.host[1].mobility.initialY = 25m
*.host[2].mobility.initialX = 50m
*.host[2].mobility.initialY = 50m
*.host[3].mobility.initialX = 25m
*.host[3].mobility.initialY = 75m
*.host[4].mobility.initialX = 75m
*.host[4].mobility.initialY = 75m

[Config arena1400]
extends = validate
*.rlBridge.arenaWidth  = 1400.0
*.rlBridge.arenaHeight = 1400.0
**.mobility.constraintAreaMaxX = 1400m
**.mobility.constraintAreaMaxY = 1400m
*.host[0].mobility.initialX = 350m
*.host[0].mobility.initialY = 350m
*.host[1].mobility.initialX = 1050m
*.host[1].mobility.initialY = 350m
*.host[2].mobility.initialX = 700m
*.host[2].mobility.initialY = 700m
*.host[3].mobility.initialX = 350m
*.host[3].mobility.initialY = 1050m
*.host[4].mobility.initialX = 1050m
*.host[4].mobility.initialY = 1050m

# ─── Spawn-mode variants of arena1400 ────────────────────────────────────────
# Drones are placed relative to the user clusters actually sampled this episode,
# instead of the decorative hardcoded cross (which starts the backbone in 3
# disconnected pieces: comps=3, routes=31/85, and never reconnects).
[Config arena1400_cluster]
extends = arena1400
*.rlBridge.droneSpawnMode = "cluster"

[Config arena1400_staging]
extends = arena1400
*.rlBridge.droneSpawnMode = "staging"
